<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login Administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4">Iniciar Sesión</h2>
    <form id="login-form" class="space-y-3">
      <input type="email" id="email" placeholder="Correo" class="w-full p-2 border rounded" required />
      <input type="password" id="password" placeholder="Contraseña" class="w-full p-2 border rounded" required />
      <button class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700">Ingresar</button>
    </form>
  </div>
</body>
</html>
